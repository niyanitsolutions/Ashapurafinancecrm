server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/v1/voice-assistant/knowledge/import {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
    }

    location = /api/v1/voice-assistant/recordings/import {
        client_max_body_size 21m;
        proxy_pass http://backend:8000;
    }

    location ~ "^/api/v1/voice-assistant/campaigns/[0-9a-f]{24}/recipients/import$" {
        client_max_body_size 6m;
        proxy_pass http://backend:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/api/;
        # Required for app/main.py's ProxyHeadersMiddleware (trusted_proxy_ips) to
        # recover the real client IP â€” without these, rate limiting and session/audit
        # IP logging all collapse onto this container's own address.
    }
}
