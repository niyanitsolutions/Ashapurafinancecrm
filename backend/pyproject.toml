[project]
name = "afs-crm-backend"
version = "0.1.0"
description = "AFS Enterprise Financial CRM backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.6",
    "motor>=3.6",
    "redis>=5.2",
    "arq>=0.26",
    "pyjwt>=2.9",
    "bcrypt>=4.1",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "httpx>=0.27",
    "cryptography>=43.0",
    # zoneinfo (stdlib) has no bundled IANA database on Windows and on minimal Linux
    # container images (e.g. python:3.12-slim) that don't ship /usr/share/zoneinfo —
    # required at runtime for the app's IST business-timezone helpers
    # (app/utils/datetime.py) to resolve "Asia/Kolkata" regardless of the deployment
    # platform. Official package maintained by the CPython core team for exactly this.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.7",
    "mypy>=1.13",
    "mongomock-motor>=0.0.29",
    "fakeredis>=2.26",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# UP046: Generic[T] is kept over PEP 695 `class Foo[T]` syntax — broader tooling/Pydantic
# compatibility today outweighs the syntax modernization.
ignore = ["UP046"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection idiom is `param: X = Depends(...)` in the signature itself.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["../tests"]
asyncio_mode = "auto"
