name: backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "tests/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --upgrade pip && pip install ".[dev]"
      - run: ruff check .
      # Explicit path: rootdir moves testpaths resolution; no collection is a failure.
      - run: pytest --rootdir=.. -c pyproject.toml ../tests --maxfail=1 -q
